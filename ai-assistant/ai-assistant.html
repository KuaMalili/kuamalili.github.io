<div id="ai-bubble" class="fixed bottom-5 left-5 z-50 cursor-pointer p-3 bg-green-700 text-white rounded-full shadow-lg hover:bg-green-800 transition-transform hover:scale-110" title="Tanya Asisten AI">

<div id="ai-chat-window" class="hidden fixed bottom-24 left-5 z-50 w-full max-w-sm sm:w-80 bg-white rounded-lg shadow-2xl transition-all duration-300 transform-gpu origin-bottom-left">

        <h3 class="font-bold">Asisten AI</h3>
        <button id="close-ai-chat" class="text-white hover:text-green-200 text-2xl font-bold leading-none">×</button>

            <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-xs">
                <p class="text-sm">Assalamualaikum! Ada yang bisa saya bantu terkait layanan KUA Malili?</p>
            </div>
        </div>
    </div>
    <div class="p-3 border-t bg-white rounded-b-lg">

            <input type="text" id="ai-chat-input" placeholder="Ketik pertanyaan..." class="flex-1 px-3 py-2 text-sm border border-gray-300 rounded-l-md focus:outline-none focus:ring-2 focus:ring-green-500" autocomplete="off">
